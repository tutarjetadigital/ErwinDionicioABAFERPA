    <!-- Toast Notification al copiar correo -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-2xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">

        <span>¡Correo copiado al portapapeles!</span>
    </div>

    <script>
        // Función para copiar el correo electrónico
        function copyEmail() {
            const email = "Erwin.dionicio@abaferpa.com";
            
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = email;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            const toast = document.getElementById("toast");
            const btnText = document.getElementById("copyBtnText");
            
            if (btnText) btnText.textContent = "¡Copiado!";
            
            if (toast) {
                toast.classList.remove("opacity-0");
                toast.classList.add("opacity-100");
                
                setTimeout(() => {
                    toast.classList.remove("opacity-100");
                    toast.classList.add("opacity-0");
                    if (btnText) btnText.textContent = "Copiar";
                }, 2500);
            }
        }
    </script>
